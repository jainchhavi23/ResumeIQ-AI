{% extends "base.html" %}

{% block content %}

<div class="upload-container">

    <h1>Resume Analysis</h1>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <div class="drop-box">

            <h2>📄 Upload Resume</h2>

            <input
                type="file"
                name="resume"
                accept=".pdf"
                required>

        </div>

        <br>

        <textarea
            name="job_description"
            placeholder="Paste Job Description Here..."
            required></textarea>

        <br><br>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

{% endblock %}
